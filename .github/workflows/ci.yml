# Continuous integration.
#
# Toolbox rule two: the tool you do not run in CI is a tool you do not have.
#
# Two platforms, deliberately. Windows with clang is what the project is
# developed on and is the only job that builds the Vulkan application. Linux
# is the second compiler, the second standard library, and the sanitizers
# Windows cannot fully provide -- UndefinedBehaviorSanitizer above all. The
# Linux jobs build the simulation core and its tests only, which is exactly
# what CODING_GUIDELINES.md section 12 says must be possible.
#
# No runner has a GPU, so the `gpu` label excludes the smoke test that runs
# the application under the validation layers. That test runs on developer
# machines through the `check` target.
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  windows-clang:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        # RelWithDebInfo is what ships; Debug is where the assertions are live.
        preset: [relwithdebinfo, debug]
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM (clang, clang-tidy, clang-format)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "22"

      # clang targets the MSVC ABI and needs the MSVC headers and libraries.
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja -y

      # Only the loader import library and glslc come from the SDK; the headers
      # are pinned by CMake. LunarG's installer supports an unattended install.
      - name: Install the Vulkan SDK
        shell: pwsh
        run: |
          Invoke-WebRequest https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe -OutFile vulkan-sdk.exe
          Start-Process -Wait -FilePath .\vulkan-sdk.exe -ArgumentList '--accept-licenses', '--default-answer', '--confirm-command', 'install'
          $sdk = (Get-ChildItem C:\VulkanSDK | Sort-Object Name -Descending | Select-Object -First 1).FullName
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "$sdk\Bin" >> $env:GITHUB_PATH

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build, lint, format
        run: cmake --build --preset ${{ matrix.preset }} --target all lint format-check

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --label-exclude gpu

  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: clang, ASan + UBSan
            preset: linux-sanitize
            lint: true
          - name: gcc 14
            preset: linux-gcc
            lint: false
    name: linux (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM (clang, clang-tidy, clang-format)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "22"

      - name: Install Ninja and GCC 14
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-14 g++-14

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # clang-tidy reads the compile database, which only makes sense for the
      # clang job: gcc's flags are not clang's flags.
      - name: Lint and format
        if: ${{ matrix.lint }}
        run: cmake --build --preset ${{ matrix.preset }} --target lint format-check

      - name: Test
        run: ctest --preset ${{ matrix.preset }}